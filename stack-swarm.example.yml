## ============================================================================
## ATENDZAPPY - EXEMPLO DE CONFIGURAÇÃO (NÃO COMMITAR SENHAS NO ARQUIVO REAL)
## ============================================================================
## Domínios:
##   Frontend: https://chat.seudominio.com
##   Backend:  https://apichat.seudominio.com
##   npx sequelize db:migrate
##   npx sequelize db:seed:all
##
## Rede: kesnet (externa, gerenciada pelo Traefik)
## Banco: pgvector (externo, na mesma rede kesnet)
## ============================================================================

version: "3.7"

services:

## ========================= ATENDZAPPY BACKEND ========================= ##

  atendzappy_backend:
    image: williamprado/atendzappy-backend:latest
    volumes:
      - atendzappy_public:/app/public
      - atendzappy_logs:/app/logs
    networks:
      - kesnet
    environment:
      ## ⚡ Ambiente
      - NODE_ENV=production
      - PORT=8080
      - TZ=America/Sao_Paulo

      ## 💬 URLs da aplicação
      - APP_URL=https://apichat.seudominio.com
      - BACKEND_URL=https://apichat.seudominio.com
      - FRONTEND_URL=https://chat.seudominio.com

      ## 🗄️ Dados do Postgres
      - DB_DIALECT=postgres
      - DB_HOST=pgvector
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=YOUR_DB_PASSWORD
      - DB_NAME=atendzappy

      ## 🔐 JWT Secrets
      - JWT_SECRET=YOUR_JWT_SECRET_MIN_32_CHARS
      - JWT_REFRESH_SECRET=YOUR_REFRESH_SECRET_MIN_32_CHARS

      ## 🧑💻 Redis
      - REDIS_URI=redis://:YOUR_REDIS_PASSWORD@atendzappy_redis:6379
      - REDIS_OPT_LIMITER_MAX=500
      - REDIS_OPT_LIMITER_DURATION=3000

      ## 📊 Limites
      - USER_LIMIT=999
      - CONNECTIONS_LIMIT=999
      - CLOSED_SEND_BY_ME=true

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 2024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.atendzappy_backend.rule=Host(`apichat.seudominio.com`)
        - traefik.http.routers.atendzappy_backend.entrypoints=websecure
        - traefik.http.routers.atendzappy_backend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atendzappy_backend.priority=1
        - traefik.http.routers.atendzappy_backend.service=atendzappy_backend
        - traefik.http.services.atendzappy_backend.loadbalancer.server.port=8080
        - traefik.http.services.atendzappy_backend.loadbalancer.passHostHeader=true
        - traefik.http.middlewares.atendzappy_sslheader.headers.customrequestheaders.X-Forwarded-Proto=https
        - traefik.http.routers.atendzappy_backend.middlewares=atendzappy_sslheader

## ========================= ATENDZAPPY FRONTEND ========================= ##

  atendzappy_frontend:
    image: williamprado/atendzappy-frontend:latest
    networks:
      - kesnet
    environment:
      - REACT_APP_BACKEND_URL=https://apichat.seudominio.com
      - NODE_ENV=production
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 2024M
      labels:
        - traefik.enable=true
        - traefik.http.routers.atendzappy_frontend.rule=Host(`chat.seudominio.com`)
        - traefik.http.routers.atendzappy_frontend.entrypoints=websecure
        - traefik.http.routers.atendzappy_frontend.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atendzappy_frontend.priority=1
        - traefik.http.routers.atendzappy_frontend.service=atendzappy_frontend
        - traefik.http.services.atendzappy_frontend.loadbalancer.server.port=80
        - traefik.http.services.atendzappy_frontend.loadbalancer.passHostHeader=true

## ========================= ATENDZAPPY REDIS ========================= ##

  atendzappy_redis:
    image: redis:7-alpine
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--port"
      - "6379"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "YOUR_REDIS_PASSWORD"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YOUR_REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - atendzappy_redis:/data
    networks:
      - kesnet
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

## ========================= VOLUMES ========================= ##

volumes:
  atendzappy_public:
    external: true
    name: atendzappy_public
  atendzappy_logs:
    external: true
    name: atendzappy_logs
  atendzappy_redis:
    external: true
    name: atendzappy_redis

## ========================= NETWORK ========================= ##

networks:
  kesnet:
    external: true
    name: kesnet
