name: Build HML Docker Images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}
      IMAGE_TAG: meta-hml-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo "::error::Configure DOCKER_USERNAME e DOCKER_PASSWORD ou DOCKER_TOKEN no repositório."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: kesassessoria/atendzappy-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: kesassessoria/atendzappy-frontend:${{ env.IMAGE_TAG }}

      - name: Print HML image tag
        run: |
          echo "HML_TAG=${IMAGE_TAG}"
          echo "HML_TAG=${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
