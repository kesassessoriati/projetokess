name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKER_TOKEN }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          if [ -z "${DOCKER_USERNAME}" ] || [ -z "${DOCKER_PASSWORD}" ]; then
            echo "::error::Configure os secrets/vars do repositorio para Docker Hub antes de rodar este workflow."
            echo "::error::Necessario: DOCKER_USERNAME (secret ou variable) e DOCKER_PASSWORD ou DOCKER_TOKEN (secret)."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Make script executable
        run: chmod +x build_and_push.sh

      - name: Run build and push script
        if: github.event_name != 'pull_request'
        run: ./build_and_push.sh

      - name: Build only (pull request validation)
        if: github.event_name == 'pull_request'
        run: |
          echo "PR build - validacao sem push para o registry."

          docker build \
            -t atendzappy-backend:pr-${{ github.event.pull_request.number }} \
            -f backend/Dockerfile ./backend

          docker build \
            --build-arg REACT_APP_BACKEND_URL="${REACT_APP_BACKEND_URL:-https://apichat.kesassessoria.com}" \
            -t atendzappy-frontend:pr-${{ github.event.pull_request.number }} \
            -f frontend/Dockerfile ./frontend

          echo "::notice::Build de PR concluido localmente. Nenhuma imagem publicada no registry."
