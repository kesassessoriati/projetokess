[global]
type=global
user_agent=AtendZappy-Asterisk

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=5.189.166.61
external_media_address=5.189.166.61
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; Trunk SobreIP - IP-auth trunk apontando para 5.189.166.61:5060.
[sobreip-aor]
type=aor
contact=sip:voz.sobreip.com.br:5060

[sobreip-endpoint]
type=endpoint
transport=transport-udp
context=from-sobreip
disallow=all
allow=ulaw
allow=alaw
aors=sobreip-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_domain=voz.sobreip.com.br

[sobreip-identify]
type=identify
endpoint=sobreip-endpoint
match=voz.sobreip.com.br

; Ramal WebRTC usado pelo CRM.
[7001]
type=endpoint
transport=transport-ws
context=from-webrtc
disallow=all
allow=opus
allow=ulaw
allow=alaw
auth=7001-auth
aors=7001
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
rtcp_mux=yes
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[7001-auth]
type=auth
auth_type=userpass
username=7001
password=8XmTEDMDKu6yZVlcXiDJluGK

[7001]
type=aor
